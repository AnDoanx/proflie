<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Khoa An | Tải video TikTok không logo" />
    <meta name="author" content="Khoa An" />
    <meta name="theme-color" content="#ffceaa" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Tải video TikTok &bull; Khoa An</title>
    <link rel="stylesheet" href="./css/tiktok.css" />
  </head>
  <body>
    <div class="bg-blur" aria-hidden="true"></div>

    <header class="page-head">
      <a class="back" href="./index.html">&#8592; Trang chủ</a>
      <div class="head-txt">
        <h1>&#11015; Tải video TikTok</h1>
        <p>Dán link video &rarr; tải MP4 không logo, MP3 hoặc ảnh bìa</p>
      </div>
    </header>

    <main class="wrap">
      <section class="box">
        <label class="lbl" for="urls">Link video (mỗi dòng một link)</label>
        <textarea id="urls" rows="3" placeholder="https://www.tiktok.com/@tambiettiktok13/video/...
https://vt.tiktok.com/xxxxxxx/"></textarea>
        <div class="row-btns">
          <button class="btn primary" id="go" type="button">&#128269; Lấy video</button>
          <button class="btn ghost" id="paste" type="button">&#128203; Dán từ clipboard</button>
          <button class="btn ghost" id="clear" type="button">&#10024; Xoá hết</button>
        </div>
        <p class="hint">
          Không cần đăng nhập, không cần token &mdash; web tự gọi API công khai. Link dạng <code>vm.tiktok.com</code> /
          <code>vt.tiktok.com</code> cũng được.
        </p>
      </section>

      <section id="out" class="out"></section>

      <section class="box" id="hist-box" hidden>
        <div class="hist-head">
          <b>&#128340; Vừa tải gần đây</b>
          <button class="btn tiny ghost" id="hist-clear" type="button">Xoá lịch sử</button>
        </div>
        <div id="hist" class="hist"></div>
      </section>
    </main>

    <script defer src="./scripts/tiktok.js"></script>
    <script>
      // Hiệu ứng tự động giãn chiều cao ô nhập link theo số dòng
      const urlInput = document.getElementById('urls');
      urlInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.max(115, this.scrollHeight) + 'px';
      });
    </script>
  </body>
</html>
